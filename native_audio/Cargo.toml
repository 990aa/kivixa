[package]
name = "kivixa_audio"
version = "0.1.0"
edition = "2021"
description = "Native Rust audio intelligence engine for Kivixa - STT, TTS, and semantic audio indexing"
authors = ["990aa"]
license = "MIT"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lib]
name = "kivixa_audio"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Flutter Rust Bridge for Dart interop
flutter_rust_bridge = "=2.12.0"

# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"

# Audio processing
hound = "3.5.1"          # WAV file handling
rubato = "2.0.0"        # High-quality resampling
dasp_sample = "0.11"   # Audio sample type conversions

# Phonemization for TTS (lightweight)
regex = "1.12.3"
unicode-normalization = "0.1.25"

# Math operations for audio processing
ndarray = "0.17.2"

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Async runtime and parallelism
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync", "macros", "time"] }
rayon = "1.12"

# Thread-safe primitives
parking_lot = "0.12.5"
once_cell = "1.21.4"
crossbeam-channel = "0.5.15"

# Logging
log = "0.4.29"
env_logger = "0.11.10"

# System info
num_cpus = "1.17.0"

# Random for audio processing
rand = "0.10.1"

# Byte order handling for audio
byteorder = "1.5"

[dev-dependencies]
tempfile = "3.27"
approx = "0.5.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

