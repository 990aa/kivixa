[package]
name = "kivixa_math"
version = "0.1.0"
edition = "2021"
description = "Native Rust math engine for Kivixa - isolated from AI inference"
authors = ["990aa"]
license = "MIT"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lib]
name = "kivixa_math"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
# Flutter Rust Bridge for Dart interop
flutter_rust_bridge = "=2.13.0"

# Error handling
anyhow = "1.0.104"
thiserror = "2.0.20"

# Matrix/Linear Algebra
nalgebra = { version = "0.35.0", features = ["serde-serialize"] }

# Statistics and Probability distributions
statrs = "0.19.1"

# Expression parsing for formulas and graphing
fasteval = "0.2.4"

# Complex numbers
num-complex = "0.4.6"

# Root finding
# roots = "0.0.8"  # Using manual Newton-Raphson instead for more control

# High-precision arithmetic
num-bigint = "0.5.1"
num-traits = "0.2.19"
num-integer = "0.1.47"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Async runtime and parallelism
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "macros"] }
rayon = "1.12"

# Logging
log = "0.4.34"
env_logger = "0.11.11"

# System info
num_cpus = "1.17.0"

# Thread-safe primitives
parking_lot = "0.12.5"
once_cell = "1.21.4"
smartcore = "0.6.14"

# For unit conversions - using a simpler approach
# uom = "0.36"  # Too complex, implementing manually for simplicity

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

