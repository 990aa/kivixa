[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unlicense",
    "ISC",
    "Apache-2.0 WITH LLVM-exception",
]
exceptions = [
    { allow = ["MIT"], name = "kivixa_math" },
    { allow = ["MIT"], name = "allo-isolate" }
]

[[licenses.clarify]]
name = "kivixa_math"
expression = "MIT"
license-files = []

[[licenses.clarify]]
name = "allo-isolate"
version = "0.1.27"
expression = "MIT"
license-files = []

[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste is unmaintained
    "RUSTSEC-2026-0097", # rand is unsound in logging
]
