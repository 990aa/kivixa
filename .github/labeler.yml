# Configuration for actions/labeler

# Rust-related changes
rust:
  - changed-files:
    - any-glob-to-any-file:
      - 'native/**/*'
      - 'native_audio/**/*'
      - 'native_math/**/*'
      - 'rust_builder/**/*'

# Dart / Flutter files
dart:
  - changed-files:
    - any-glob-to-any-file:
      - 'lib/**/*.dart'
      - 'test/**/*.dart'
      - 'pubspec.yaml'

flutter:
  - changed-files:
    - any-glob-to-any-file:
      - 'lib/**/*'
      - 'assets/**/*'

# Android, iOS, Windows, Linux
android:
  - changed-files:
    - any-glob-to-any-file:
      - 'android/**/*'

ios:
  - changed-files:
    - any-glob-to-any-file:
      - 'ios/**/*'

windows:
  - changed-files:
    - any-glob-to-any-file:
      - 'windows/**/*'

linux:
  - changed-files:
    - any-glob-to-any-file:
      - 'linux/**/*'

# CI workflow changes
ci:
  - changed-files:
    - any-glob-to-any-file:
      - '.github/workflows/**/*'
