# codecov.yml
codecov:
  notify:
    wait_for_ci: yes  # Wait for both Flutter and Rust tests to finish

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%  # Allow 1% drop before failing
    patch:
      default:
        target: auto
        threshold: 0%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false  # Post a comment even if coverage didn't change

# Categorize reports so you can see Rust vs Flutter coverage
flags:
  rust:
    paths:
      - native/
      - native_math/
      - native_audio/
  flutter:
    paths:
      - lib/