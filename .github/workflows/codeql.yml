name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'actions', 'java-kotlin', 'rust' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive 

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # MAGIC FIX: Use 'manual' for Java/Kotlin, but 'none' for Rust and Actions!
        build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}

    # --------------------------------------------------------
    # JAVA-KOTLIN BUILD (FLUTTER)
    # This remains because Android compilation still requires tracing
    # --------------------------------------------------------
    - name: Setup Java (Java-Kotlin)
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter (Java-Kotlin)
      if: matrix.language == 'java-kotlin'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.7'
        channel: 'stable'
        cache: true

    - name: Get Flutter dependencies (Java-Kotlin)
      if: matrix.language == 'java-kotlin'
      run: flutter pub get

    - name: Manual Build for CodeQL (Java-Kotlin)
      if: matrix.language == 'java-kotlin'
      continue-on-error: true 
      run: flutter build apk --debug

    # --------------------------------------------------------
    # FINAL ANALYSIS
    # (Rust and Actions skip straight here without needing to build)
    # --------------------------------------------------------
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"