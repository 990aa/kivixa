name: "Close Stale Issues and PRs"

on:
  schedule:
    - cron: "30 1 * * 0"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: "This issue is stale because it has been open for 30 days with no activity. Comment or remove the stale label within 5 days to keep it open."
          close-issue-message: "Closing this issue because it has been stale for 5 more days with no activity."
          stale-pr-message: "This pull request is stale because it has been open for 45 days with no activity. Comment or remove the stale label within 10 days to keep it open."
          close-pr-message: "Closing this pull request because it has been stale for 10 more days with no activity."
          days-before-issue-stale: 30
          days-before-issue-close: 5
          days-before-pr-stale: 45
          days-before-pr-close: 10
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          exempt-issue-labels: "pinned,security,planned"
          exempt-pr-labels: "pinned,security,work in progress"