name: Pull request update

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual triggers from the Actions tab

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required to push merge commits to PR branches
      pull-requests: write  # Required to read and update open PRs
    steps:
      - name: Auto-update all open PRs (including bots)
        uses: chrisebale/autoupdate@v2
        with:
          # Uses the default GITHUB_TOKEN to perform the updates
          token: ${{ secrets.GITHUB_TOKEN }}
