name: PR Quality Gate

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to validate (for manual dispatch)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  resolve-target:
    name: Resolve Validation Target
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      target_label: ${{ steps.resolve.outputs.target_label }}
    steps:
      - name: Resolve checkout reference
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.pr_number }}" ]]; then
            echo "checkout_ref=refs/pull/${{ inputs.pr_number }}/head" >> "$GITHUB_OUTPUT"
            echo "target_label=PR #${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
            echo "target_label=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

  flutter-quality:
    name: Flutter Quality Suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: resolve-target
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce Dart formatting
        run: dart format --set-exit-if-changed --output=none .

      - name: Analyze Flutter/Dart code (fatal warnings and infos)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run full Flutter test suite
        run: flutter test --no-pub --reporter expanded

  rust-quality:
    name: Rust Quality Suite (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: resolve-target
    strategy:
      fail-fast: false
      matrix:
        crate: [native, native_audio, native_math, rust_builder]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Cargo check
        run: cargo check --manifest-path ${{ matrix.crate }}/Cargo.toml --all-targets --all-features

      - name: Cargo clippy (deny warnings)
        run: cargo clippy --manifest-path ${{ matrix.crate }}/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Cargo fmt check
        run: cargo fmt --manifest-path ${{ matrix.crate }}/Cargo.toml --all -- --check

      - name: Run full Rust test suite
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --manifest-path ${{ matrix.crate }}/Cargo.toml --all-targets --all-features
