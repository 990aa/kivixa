name: PR Quality Gate

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Manual PR {0}', inputs.pr_number) || format('PR {0}', github.event.pull_request.number) }}

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to validate (for manual dispatch)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  resolve-target:
    name: Resolve Validation Target
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      target_label: ${{ steps.resolve.outputs.target_label }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
    steps:
      - name: Resolve checkout reference
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.pr_number }}" ]]; then
            base_sha=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}" --jq '.base.sha')
            head_sha=$(gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}" --jq '.head.sha')
            echo "checkout_ref=refs/pull/${{ inputs.pr_number }}/head" >> "$GITHUB_OUTPUT"
            echo "target_label=PR ${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
            echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=refs/pull/${{ github.event.pull_request.number }}/head" >> "$GITHUB_OUTPUT"
            echo "target_label=PR ${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

  flutter-quality:
    name: Flutter Quality Suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: resolve-target
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce Dart formatting
        run: dart format --set-exit-if-changed --output=none lib/ test/

      - name: Analyze Flutter/Dart code (fatal warnings and infos)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run full Flutter test suite
        run: flutter test --no-pub --reporter expanded

  rust-quality:
    name: Rust Quality Suite (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: resolve-target
    strategy:
      fail-fast: false
      matrix:
        crate: [native, native_audio, native_math]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Cargo check
        run: cargo check --manifest-path ${{ matrix.crate }}/Cargo.toml --all-targets --all-features

      - name: Cargo clippy (deny warnings for production targets)
        run: cargo clippy --manifest-path ${{ matrix.crate }}/Cargo.toml --all-features --lib --bins --examples -- -D warnings

      - name: Cargo fmt check
        working-directory: ${{ matrix.crate }}
        run: cargo fmt --all -- --check

      - name: Run full Rust test suite
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --manifest-path ${{ matrix.crate }}/Cargo.toml --all-targets --all-features

  rust-security:
    name: Rust Security & Policy (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: resolve-target
    strategy:
      fail-fast: false
      matrix:
        crate: [native, native_audio, native_math]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Cargo audit
        run: cargo audit --file ${{ matrix.crate }}/Cargo.lock || echo "Cargo audit failed, continuing anyway..."

      - name: Cargo deny
        working-directory: ${{ matrix.crate }}
        run: cargo deny check
