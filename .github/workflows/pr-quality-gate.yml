name: PR Quality Gate

run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.pr_number != '' && inputs.pr_number != '0' && format('Manual PR {0}', inputs.pr_number) || format('Manual Branch {0}', github.ref_name)) || format('PR {0}', github.event.pull_request.number) }}

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to validate when manually dispatching this workflow. Use 0 to run full validation for the selected branch."
        required: false
        default: "0"
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ inputs.pr_number || '0' }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.2"

jobs:
  resolve-target:
    name: Resolve Validation Target
    runs-on: ubuntu-latest
    outputs:
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
      target_label: ${{ steps.resolve.outputs.target_label }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      full_run: ${{ steps.resolve.outputs.full_run }}
    steps:
      - name: Resolve checkout reference
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pr_number="${{ inputs.pr_number }}"

            if [[ -n "$pr_number" && "$pr_number" != "0" ]]; then
              base_sha=$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.base.sha')
              head_sha=$(gh api "repos/${{ github.repository }}/pulls/${pr_number}" --jq '.head.sha')

              if [[ -z "$base_sha" || -z "$head_sha" || "$base_sha" == "null" || "$head_sha" == "null" ]]; then
                echo "::error::Unable to resolve base/head SHA for PR #${pr_number}."
                exit 1
              fi

              echo "checkout_ref=refs/pull/${pr_number}/head" >> "$GITHUB_OUTPUT"
              echo "target_label=PR ${pr_number}" >> "$GITHUB_OUTPUT"
              echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
              echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
              echo "full_run=false" >> "$GITHUB_OUTPUT"
            else
              echo "checkout_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
              echo "target_label=Branch ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
              echo "base_sha=" >> "$GITHUB_OUTPUT"
              echo "head_sha=" >> "$GITHUB_OUTPUT"
              echo "full_run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "checkout_ref=refs/pull/${{ github.event.pull_request.number }}/head" >> "$GITHUB_OUTPUT"
            echo "target_label=PR ${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "full_run=false" >> "$GITHUB_OUTPUT"
          fi

  flutter-quality:
    name: Flutter Quality Suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: resolve-target
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Collect changed Dart files
        id: changed_dart
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.resolve-target.outputs.full_run }}" == "true" ]]; then
            find . -type f -name '*.dart' \
              ! -name '*.g.dart' \
              ! -name '*.freezed.dart' \
              | sort > changed_dart_files.txt
          else
            if [[ -z "${{ needs.resolve-target.outputs.base_sha }}" || -z "${{ needs.resolve-target.outputs.head_sha }}" ]]; then
              echo "::error::Missing base/head SHA for Dart changed-files diff."
              exit 1
            fi

            git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}" || true
            git diff --diff-filter=ACMR --name-only "${{ needs.resolve-target.outputs.base_sha }}...${{ needs.resolve-target.outputs.head_sha }}" -- '*.dart' \
              | grep -vE '\.(g|freezed)\.dart$' > changed_dart_files.txt || true
          fi

          if [[ -s changed_dart_files.txt ]]; then
            echo "has_changed_dart=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changed_dart=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce Dart formatting (changed files)
        if: steps.changed_dart.outputs.has_changed_dart == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r' < changed_dart_files.txt | tr '\n' '\0' | xargs -0 -r dart format --set-exit-if-changed

      - name: Analyze Flutter/Dart code (fatal warnings and infos)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run full Flutter test suite (skip fm_test)
        shell: bash
        run: |
          set -euo pipefail
          echo "Temporarily skipping test/fm_test.dart in CI."
          mapfile -t test_files < <(find test -type f -name '*_test.dart' ! -name 'fm_test.dart' | sort)
          if [[ ${#test_files[@]} -eq 0 ]]; then
            echo "::error::No test files found to run."
            exit 1
          fi
          flutter test --no-pub --coverage --reporter expanded "${test_files[@]}"

      - name: Upload Flutter coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          flags: flutter_app
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  rust-quality:
    name: Rust Quality Suite (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: resolve-target
    strategy:
      fail-fast: false
      matrix:
        crate: [native, native_audio, native_math]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}

      - name: Cargo check
        run: cargo check --manifest-path ${{ matrix.crate }}/Cargo.toml --all-targets --all-features

      - name: Cargo clippy (deny warnings for production targets)
        run: cargo clippy --manifest-path ${{ matrix.crate }}/Cargo.toml --all-features --lib --bins --examples -- -D warnings

      - name: Collect changed Rust files in crate
        id: changed_rs
        shell: bash
        run: |
          set -euo pipefail

          crate="${{ matrix.crate }}"

          if [[ "${{ needs.resolve-target.outputs.full_run }}" == "true" ]]; then
            # Added exclusions for target/ and vendor/
            find "$crate" -type f -name '*.rs' \
              -not -path "*/target/*" \
              -not -path "*/vendor/*" \
              | sed "s#^${crate}/##" \
              | sort > "${crate}/changed_rs_files.txt"
          else
            if [[ -z "${{ needs.resolve-target.outputs.base_sha }}" || -z "${{ needs.resolve-target.outputs.head_sha }}" ]]; then
              echo "::error::Missing base/head SHA for Rust changed-files diff."
              exit 1
            fi

            git diff --name-only "${{ needs.resolve-target.outputs.base_sha }}...${{ needs.resolve-target.outputs.head_sha }}" -- "$crate" \
              | grep -E "^${crate}/.*\.rs$" \
              | sed "s#^${crate}/##" > "${crate}/changed_rs_files.txt" || true
          fi

          if [[ -s "${crate}/changed_rs_files.txt" ]]; then
            echo "has_changed_rs=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changed_rs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cargo fmt check (changed Rust files)
        if: steps.changed_rs.outputs.has_changed_rs == 'true'
        working-directory: ${{ matrix.crate }}
        shell: bash
        run: |
          set -euo pipefail
          xargs -r cargo fmt -- --check < changed_rs_files.txt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-llvm-cov

      - name: Run full Rust test suite with coverage
        env:
          RUST_TEST_THREADS: "1"
        run: |
          cargo llvm-cov --manifest-path ${{ matrix.crate }}/Cargo.toml --all-features --lcov --output-path lcov-${{ matrix.crate }}.info --ignore-filename-regex '.*\.g\.rs|.*\.freezed\.rs'

      - name: Upload Rust coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage-${{ matrix.crate }}
          path: lcov-${{ matrix.crate }}.info
          retention-days: 1
          if-no-files-found: error

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: lcov-${{ matrix.crate }}.info
          flags: ${{ matrix.crate }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

  rust-security:
    name: Rust Security & Policy (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: resolve-target
    strategy:
      fail-fast: false
      matrix:
        crate: [native, native_audio, native_math]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.checkout_ref }}
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-audit,cargo-deny

      - name: Cargo audit
        working-directory: ${{ matrix.crate }}
        run: cargo audit

      - name: Cargo deny
        working-directory: ${{ matrix.crate }}
        run: cargo deny check

  path-filter:
    name: Filter Changed Paths
    runs-on: ubuntu-latest
    needs: resolve-target
    outputs:
      native: ${{ steps.set_outputs.outputs.native }}
      native_audio: ${{ steps.set_outputs.outputs.native_audio }}
      native_math: ${{ steps.set_outputs.outputs.native_math }}
      dart_other: ${{ steps.set_outputs.outputs.dart_other }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.checkout_ref }}
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        if: ${{ needs.resolve-target.outputs.full_run != 'true' }}
        with:
          base: ${{ needs.resolve-target.outputs.base_sha }}
          ref: ${{ needs.resolve-target.outputs.head_sha }}
          filters: |
            native:
              - 'native/**'
            native_audio:
              - 'native_audio/**'
            native_math:
              - 'native_math/**'
            dart_other:
              - '**'
              - '!native/**'
              - '!native_audio/**'
              - '!native_math/**'
              - '!.github/**'
              - '!docs/**'
              - '!*.md'

      - name: Force all paths for manual full runs
        id: manual_filter
        if: ${{ needs.resolve-target.outputs.full_run == 'true' }}
        shell: bash
        run: |
          echo "native=true" >> "$GITHUB_OUTPUT"
          echo "native_audio=true" >> "$GITHUB_OUTPUT"
          echo "native_math=true" >> "$GITHUB_OUTPUT"
          echo "dart_other=true" >> "$GITHUB_OUTPUT"

      - name: Set outputs
        id: set_outputs
        shell: bash
        run: |
          if [[ "${{ needs.resolve-target.outputs.full_run }}" == "true" ]]; then
            echo "native=${{ steps.manual_filter.outputs.native }}" >> "$GITHUB_OUTPUT"
            echo "native_audio=${{ steps.manual_filter.outputs.native_audio }}" >> "$GITHUB_OUTPUT"
            echo "native_math=${{ steps.manual_filter.outputs.native_math }}" >> "$GITHUB_OUTPUT"
            echo "dart_other=${{ steps.manual_filter.outputs.dart_other }}" >> "$GITHUB_OUTPUT"
          else
            echo "native=${{ steps.filter.outputs.native }}" >> "$GITHUB_OUTPUT"
            echo "native_audio=${{ steps.filter.outputs.native_audio }}" >> "$GITHUB_OUTPUT"
            echo "native_math=${{ steps.filter.outputs.native_math }}" >> "$GITHUB_OUTPUT"
            echo "dart_other=${{ steps.filter.outputs.dart_other }}" >> "$GITHUB_OUTPUT"
          fi

  build-android-arm64:
    name: Build Android ARM64
    runs-on: ubuntu-latest
    needs: [resolve-target, path-filter]
    if: ${{ needs.path-filter.outputs.dart_other == 'true' || needs.path-filter.outputs.native == 'true' || needs.path-filter.outputs.native_audio == 'true' || needs.path-filter.outputs.native_math == 'true' }}
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.checkout_ref }}
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Build native (Android)
        if: ${{ needs.path-filter.outputs.native == 'true' || needs.path-filter.outputs.dart_other == 'true' }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd native
          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API_LEVEL=23
          export CC_aarch64_linux_android="${NDK_BIN}/aarch64-linux-android${API_LEVEL}-clang"
          export CXX_aarch64_linux_android="/aarch64-linux-android-clang++"
          export AR_aarch64_linux_android="${NDK_BIN}/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${NDK_BIN}/aarch64-linux-android${API_LEVEL}-clang"
          cargo build --release --target aarch64-linux-android
          cd ..
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp native/target/aarch64-linux-android/release/libkivixa_native.so android/app/src/main/jniLibs/arm64-v8a/
          NDK_LIBCPP_ARM64="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          if [ -f "$NDK_LIBCPP_ARM64" ]; then
            cp "$NDK_LIBCPP_ARM64" android/app/src/main/jniLibs/arm64-v8a/
          fi

      - name: Build native_audio (Android)
        if: ${{ needs.path-filter.outputs.native_audio == 'true' || needs.path-filter.outputs.dart_other == 'true' }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd native_audio
          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API_LEVEL=23
          export CC_aarch64_linux_android="${NDK_BIN}/aarch64-linux-android${API_LEVEL}-clang"
          export CXX_aarch64_linux_android="/aarch64-linux-android-clang++"
          export AR_aarch64_linux_android="${NDK_BIN}/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${NDK_BIN}/aarch64-linux-android${API_LEVEL}-clang"
          cargo build --release --target aarch64-linux-android
          cd ..
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp native_audio/target/aarch64-linux-android/release/libkivixa_audio.so android/app/src/main/jniLibs/arm64-v8a/

      - name: Build native_math (Android)
        if: ${{ needs.path-filter.outputs.native_math == 'true' || needs.path-filter.outputs.dart_other == 'true' }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd native_math
          NDK_BIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API_LEVEL=23
          export CC_aarch64_linux_android="${NDK_BIN}/aarch64-linux-android${API_LEVEL}-clang"
          export CXX_aarch64_linux_android="/aarch64-linux-android-clang++"
          export AR_aarch64_linux_android="${NDK_BIN}/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="${NDK_BIN}/aarch64-linux-android${API_LEVEL}-clang"
          cargo build --release --target aarch64-linux-android
          cd ..
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp native_math/target/aarch64-linux-android/release/libkivixa_math.so android/app/src/main/jniLibs/arm64-v8a/

      - name: Build Android APK
        if: ${{ needs.path-filter.outputs.dart_other == 'true' }}
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64

  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: [resolve-target, path-filter]
    if: ${{ needs.path-filter.outputs.dart_other == 'true' || needs.path-filter.outputs.native == 'true' || needs.path-filter.outputs.native_audio == 'true' || needs.path-filter.outputs.native_math == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-target.outputs.checkout_ref }}
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build native (Windows)
        if: ${{ needs.path-filter.outputs.native == 'true' || needs.path-filter.outputs.dart_other == 'true' }}
        shell: pwsh
        run: |
          Set-Location native
          cargo build --release --target x86_64-pc-windows-msvc
          Set-Location ..
          New-Item -ItemType Directory -Force -Path "build/windows/x64/runner/Release" | Out-Null
          Copy-Item "native/target/x86_64-pc-windows-msvc/release/kivixa_native.dll" "build/windows/x64/runner/Release/" -Force

      - name: Build native_audio (Windows)
        if: ${{ needs.path-filter.outputs.native_audio == 'true' || needs.path-filter.outputs.dart_other == 'true' }}
        shell: pwsh
        run: |
          Set-Location native_audio
          cargo build --release --target x86_64-pc-windows-msvc
          Set-Location ..
          New-Item -ItemType Directory -Force -Path "build/windows/x64/runner/Release" | Out-Null
          Copy-Item "native_audio/target/x86_64-pc-windows-msvc/release/kivixa_audio.dll" "build/windows/x64/runner/Release/" -Force

      - name: Build native_math (Windows)
        if: ${{ needs.path-filter.outputs.native_math == 'true' || needs.path-filter.outputs.dart_other == 'true' }}
        shell: pwsh
        run: |
          Set-Location native_math
          cargo build --release --target x86_64-pc-windows-msvc
          Set-Location ..
          New-Item -ItemType Directory -Force -Path "build/windows/x64/runner/Release" | Out-Null
          Copy-Item "native_math/target/x86_64-pc-windows-msvc/release/kivixa_math.dll" "build/windows/x64/runner/Release/" -Force

      - name: Build Windows app
        if: ${{ needs.path-filter.outputs.dart_other == 'true' }}
        run: |
          flutter pub get
          flutter build windows --release

      - name: Upload Windows Build
        if: ${{ needs.path-filter.outputs.dart_other == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: kivixa-windows-build
          path: build/windows/x64/runner/Release/
          retention-days: 5