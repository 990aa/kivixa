[package]
name = "kivixa_native"
version = "0.1.0"
edition = "2021"
description = "Native Rust engine for Kivixa AI features"
authors = ["990aa"]
license = "MIT"

[features]
default = ["mtmd"]
mtmd = []


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lib]
name = "kivixa_native"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Flutter Rust Bridge for Dart interop
flutter_rust_bridge = "=2.12.0"

# Error handling
anyhow = "1.0.102"

# Llama.cpp bindings for Phi-4 inference
# Default: CPU mode (no GPU features) - safe for all platforms
llama-cpp-2 = { version = "0.1.146", default-features = false, features = ["mtmd"] }

# Force-directed graph simulation for knowledge graph
fdg-sim = "0.9.1"

# Serialization for graph data
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Logging
log = "0.4.29"
env_logger = "0.11.10"

# Thread-safe primitives
parking_lot = "0.12.5"

# Lazy statics
once_cell = "1.21.4"

# Async runtime (for streaming responses)
tokio = { version = "1.52.3", features = ["rt-multi-thread", "sync"] }

# ============================================================================
# Platform-Specific GPU Backends (Hybrid Performance Strategy)
# ============================================================================

# Windows/Linux: CPU mode only (AVX2 auto-detected, no SDK required)
# llama.cpp is highly optimized for CPUs - 10-15 tokens/sec on modern CPUs
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
llama-cpp-sys-2 = { version = "0.1.146", default-features = false, features = ["mtmd"] }

# Android: Vulkan for GPU acceleration (NDK includes Vulkan headers)
[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-sys-2 = { version = "0.1.146", features = ["mtmd"] }

# macOS/iOS: Metal for Apple Silicon GPU acceleration
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
llama-cpp-sys-2 = { version = "0.1.146", features = ["metal", "mtmd"] }

[build-dependencies]
cc = "1.2.62"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[patch.crates-io]
llama-cpp-sys-2 = { path = "vendor/llama-cpp-sys-2" }
