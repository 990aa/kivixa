[graph]
all-features = true

[advisories]
ignore = [
  # Transitive from simba/nalgebra/statrs in native_math; no safe upgrade path
  # available at this time according to RustSec advisory details.
  "RUSTSEC-2024-0436",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "MPL-2.0",
  "Zlib",
  "CC0-1.0",
  "Apache-2.0 WITH LLVM-exception",
]
exceptions = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
